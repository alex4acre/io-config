[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "io-config"
version = "1.4.3"
description = "EtherCAT bus scan with ESI, ENI and EEPROM cross-check"
requires-python = ">=3.10"
dependencies = [
    "ctrlx-datalayer<=3.6",
    "ctrlx-fbs"
]

[project.scripts]
app-main = "app.main:main"

[tool.setuptools]
packages = ["app"]
